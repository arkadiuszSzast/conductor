name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a platform-grade change to Conductor,
            a self-hosted, runtime-agnostic CI system for AI coding agents.

            Read AGENTS.md and the relevant artifacts under openspec/changes/
            before reviewing. Check that the implementation satisfies the
            OpenSpec requirements and only marks tasks that are actually done.

            Focus on:
            - correctness, state-machine semantics, idempotency, and recovery
            - preserving the pure-interpreter / effectful-engine boundary
            - SQLite durability and additive migration safety when applicable
            - bounded retries, loops, leases, and concurrency behavior
            - runner/runtime abstraction leaks and host-specific assumptions
            - API and configuration compatibility
            - security: command injection, path escape, token leakage, unsafe
              workflow/action input, and excessive permissions
            - test coverage for failure paths and behavior carried over from
              opencode-conductor
            - scope discipline and maintainability

            Prioritize concrete bugs and missing tests over stylistic nits.
            Include exact file and line references for actionable findings.

            The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` with
            `confirmed: true` for specific code issues.
            Only post review feedback to GitHub.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
