name: bad-input-type

inputs:
  feature: { type: text, required: true }
  budget: { type: number, required: true, default: 3 }
  quiet: { type: boolean }
  retries: { type: number, default: "three" }

roles:
  implementer: { agent: build }

jobs:
  main:
    steps:
      - id: implement
        agent:
          role: implementer
          prompt: "work"
