name: minimal-linear
on: [manual]

inputs:
  feature: { type: string, required: true }

roles:
  implementer: { agent: build }

jobs:
  main:
    steps:
      - id: implement
        agent:
          role: implementer
          prompt: "Implement {{ inputs.feature }}."
      - id: verify
        command:
          run:
            - bun test
