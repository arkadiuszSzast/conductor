name: feature-delivery
on: [manual]

inputs:
  feature: { type: string, required: true }

roles:
  architect:   { agent: build,  model: prov/architect }
  judge:       { agent: review, model: prov/judge }
  implementer: { agent: build,  model: prov/implementer }
  quality:     { agent: review, model: prov/quality }
  reviewer:    { agent: review, model: prov/reviewer }

jobs:
  architect-a:
    outputs:
      design: "{{ steps.design.outputs.report }}"
    steps:
      - id: design
        agent:
          role: architect
          prompt: |
            Propose an architecture for {{ inputs.feature }}.

            Your previous proposal (empty in round 1):
            {{ feedback.jobs["architect-a"]["design"]["report"] }}
            The other architect's proposal:
            {{ feedback.jobs["architect-b"]["design"]["report"] }}
            Judge's notes: {{ feedback.jobs["consensus"]["agree"]["report"] }}
            Reason for sending back: {{ feedback.message }}

  architect-b:
    outputs:
      design: "{{ steps.design.outputs.report }}"
    steps:
      - id: design
        agent:
          role: architect
          prompt: |
            Propose an independent architecture for {{ inputs.feature }}.

            Your previous proposal (empty in round 1):
            {{ feedback.jobs["architect-b"]["design"]["report"] }}
            The other architect's proposal:
            {{ feedback.jobs["architect-a"]["design"]["report"] }}
            Judge's notes: {{ feedback.jobs["consensus"]["agree"]["report"] }}

  consensus:
    needs: [architect-a, architect-b]
    outputs:
      decision: "{{ steps.agree.outputs.report }}"
    steps:
      - id: agree
        agent:
          role: judge
          prompt: |
            Compare the architectures; answer with outcome approved or
            changes_requested. ALWAYS put the reasoning in the report.

            A: {{ needs["architect-a"].outputs.design }}
            B: {{ needs["architect-b"].outputs.design }}
        outcomes:
          approved: next
          changes_requested:
            rerun: { scope: jobs, jobIds: [architect-a, architect-b], maxRounds: 5 }

  deliver:
    needs: [consensus]
    steps:
      - id: worktree
        command:
          run:
            - |
              name="feature-{{ inputs.feature }}"
              git worktree add "../$name" -b "$name"
              echo "branch=$name"               >> "$CONDUCTOR_OUTPUT"
              echo "path=$(cd ../$name && pwd)" >> "$CONDUCTOR_OUTPUT"

      - id: openspec
        agent:
          role: implementer
          prompt: |
            Write an OpenSpec change. Work in {{ steps.worktree.outputs.path }}.
            Agreed architecture: {{ needs["consensus"].outputs.decision }}

      - id: implement
        agent:
          role: implementer
          prompt: |
            Implement {{ inputs.feature }} according to
            {{ steps.openspec.outputs.report }}.

            Previous iteration: {{ feedback.jobs["deliver"]["implement"]["report"] }}
            Quality notes: {{ feedback.jobs["deliver"]["quality"]["report"] }}
            Review notes: {{ feedback.jobs["deliver"]["internal-review"]["report"] }}
            PR notes: {{ feedback.jobs["deliver"]["pr-review"]["notes"] }}

      - id: quality
        agent:
          role: quality
          prompt: "Build, tests, lint. Answer approved or issues; problems go in the report."
        outcomes:
          approved: next
          issues:
            rerun: { scope: steps, stepIds: [implement], maxRounds: 3 }

      - id: internal-review
        agent:
          role: reviewer
          prompt: "Review the diff. approved or changes_requested; notes go in the report."
        outcomes:
          approved: next
          changes_requested:
            rerun: { scope: steps, stepIds: [implement, quality], maxRounds: 3 }

      - id: push
        action: { uses: git/push@v1 }        # outputs: sha, url

      - id: pr-review
        human: {}          # approver sees the feature/step context; a gate
                           # prompt field is (planned)
        outcomes:
          approved: next
          rejected:
            rerun: { scope: steps, stepIds: [implement, quality, internal-review], maxRounds: 3 }

      - id: merge
        action:
          uses: git/pr-merge@v1
          with: { method: squash }
        retry:
          maxAttempts: 3
          backoff: { strategy: constant, delay: 30000 }
