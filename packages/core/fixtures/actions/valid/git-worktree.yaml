name: git/worktree
version: 1.3.1
description: Create or remove a feature worktree.
inputs:
  branch: { type: string, required: true }
  action: { type: string, default: create }
  paths:  { type: "string[]", default: [] }
outputs:
  branch: { type: string }
  path:   { type: string }
capabilities: [git, filesystem]
run: [bun, run, worktree.ts]
